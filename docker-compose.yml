services:
  service-a:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE: service-a
    ports:
      - "5005:5005"
    environment:
      GRPC_PORT: 5005
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: service-a
    depends_on:
      - service-b
      - otel-collector

  service-b:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        SERVICE: service-b
    ports:
      - "5006:5005"
    environment:
      GRPC_PORT: 5005
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: service-b
    depends_on:
      - otel-collector

  otel-collector:
    attach: false
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./collector.yml:/etc/otelcol/config.yml
    ports:
      - "4318:4318" # OTLP/HTTP
      - "4317:4317" # OTLP/gRPC
      - "8889:8889" # Prometheus metrics

  jaeger:
    attach: false
    image: jaegertracing/all-in-one:1.41
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686" # UI
    depends_on:
      - otel-collector
